<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Radar</title>
<link rel="stylesheet" href="/styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📍</text></svg>">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <h1>Job Radar</h1>
    <p id="tagline">Loading</p>
  </div>
  <nav class="countries" id="countries"></nav>
  <div class="topbar-actions">
    <span id="runState" class="runstate"></span>
    <button id="refreshBtn" class="btn">Refresh now</button>
  </div>
</header>

<div id="permitNote" class="permit-note" hidden></div>

<div class="layout">

  <aside class="sidebar" id="sidebar">
    <div class="field">
      <input type="search" id="q" placeholder="Search title, company or text" autocomplete="off">
    </div>

    <section class="panel">
      <div class="panel-head">
        <h2>Visa sponsorship</h2>
        <button class="link" data-clear="sponsorship">Clear</button>
      </div>
      <div id="sponsorship" class="checklist"></div>
      <p class="panel-note">Read from what each advert says, plus the employer's track record. A signal, not a promise.</p>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>Region</h2>
        <button class="link" data-clear="regions">Clear</button>
      </div>
      <div id="regions" class="regions"></div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>Category</h2>
        <button class="link" data-clear="groups">Clear</button>
      </div>
      <div id="groups" class="checklist"></div>
    </section>

    <section class="panel">
      <div class="panel-head"><h2>Working pattern</h2></div>
      <div id="modes" class="checklist"></div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>Job type</h2>
        <button class="link" data-clear="types">Clear</button>
      </div>
      <div id="types" class="checklist"></div>
    </section>

    <section class="panel">
      <div class="panel-head"><h2>Refine</h2></div>

      <label class="field-row">
        <span>Posted within</span>
        <select id="days">
          <option value="0">Any time</option>
          <option value="1">24 hours</option>
          <option value="3">3 days</option>
          <option value="7">7 days</option>
          <option value="14" selected>14 days</option>
          <option value="30">30 days</option>
        </select>
      </label>

      <label class="field-row">
        <span>Match strength</span>
        <select id="minScore">
          <option value="0">Anything related</option>
          <option value="10" selected>Good match</option>
          <option value="20">Strong match</option>
        </select>
      </label>

      <label class="field-row">
        <span>Salary at least</span>
        <select id="salaryMin">
          <option value="0">Any</option>
          <option value="30000">€30,000</option>
          <option value="40000">€40,000</option>
          <option value="50000">€50,000</option>
          <option value="60000">€60,000</option>
          <option value="75000">€75,000</option>
          <option value="90000">€90,000</option>
        </select>
      </label>

      <label class="toggle">
        <input type="checkbox" id="savedOnly">
        <span>Shortlist only</span>
      </label>
    </section>

    <section class="panel">
      <div class="panel-head"><h2>Source</h2></div>
      <div id="sources" class="checklist"></div>
    </section>

    <button class="btn btn-quiet full" id="resetAll">Reset all filters</button>
  </aside>

  <main class="main">
    <div class="resultbar">
      <div id="count" class="count">Loading</div>
      <div class="resultbar-right">
        <label class="inline">
          <span>Sort</span>
          <select id="sort">
            <option value="newest">Newest posted</option>
            <option value="found">Recently found</option>
            <option value="relevance">Best match</option>
            <option value="salary">Highest salary</option>
            <option value="company">Company A to Z</option>
          </select>
        </label>
        <a id="exportBtn" class="btn btn-quiet" href="#">Export CSV</a>
      </div>
    </div>

    <div id="results" class="results"></div>
    <div id="pager" class="pager"></div>
  </main>

</div>

<script src="/app.js"></script>
</body>
</html>
