# Collects jobs on a schedule and publishes the static site to GitHub Pages.
name: Publish site

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # The job database lives in the Actions cache between runs, so each run
      # tops up what the last one found instead of starting from nothing.
      - uses: actions/cache/restore@v4
        with:
          path: data/jobs.db
          key: jobs-db-${{ github.run_id }}
          restore-keys: jobs-db-

      - run: npm test
      - name: Restore public job history
        run: node --no-warnings scripts/seed-hosted-jobs.js
      - name: Collect jobs
        run: npm run refresh
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
      - run: npm run build:site

      # Fold the write-ahead log into the main file so the cache holds one complete database.
      - run: node --no-warnings -e "import('./src/db.js').then(({ db }) => { db.exec('PRAGMA wal_checkpoint(TRUNCATE)'); db.close() })"
      - uses: actions/cache/save@v4
        with:
          path: data/jobs.db
          key: jobs-db-${{ github.run_id }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
